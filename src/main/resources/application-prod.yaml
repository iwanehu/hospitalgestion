spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    hikari:
      pool-name: HospitalHikariPool
      minimum-idle: ${DB_POOL_MIN_SIZE:2}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}

  jpa:
    show-sql: false

security:
  jwt:
    secret: ${JWT_SECRET}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

springdoc:
  api-docs:
    enabled: false

  swagger-ui:
    enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

logging:
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    com.hospital.gestion: ${APP_LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.hibernate.SQL: WARN


app:
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    document-id: ${BOOTSTRAP_ADMIN_DOCUMENT_ID:}
    first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME:}
    last-name: ${BOOTSTRAP_ADMIN_LAST_NAME:}
    phone: ${BOOTSTRAP_ADMIN_PHONE:}
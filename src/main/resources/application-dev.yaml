spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hospital?currentSchema=public}
    username: ${DB_USERNAME:hospital}
    password: ${DB_PASSWORD:hospital}

  jpa:
    show-sql: ${JPA_SHOW_SQL:true}

security:
  jwt:
    secret: ${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  api-docs:
    enabled: true

  swagger-ui:
    enabled: true

logging:
  level:
    root: INFO
    com.hospital.gestion: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

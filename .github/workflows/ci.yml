name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18.4-alpine

        env:
          POSTGRES_DB: hospital
          POSTGRES_USER: hospital
          POSTGRES_PASSWORD: ci_test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U hospital -d hospital"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/hospital?currentSchema=public
      DB_USERNAME: hospital
      DB_PASSWORD: ci_test_password

      JWT_SECRET: Y2lfdGVzdF9qd3Rfc2VjcmV0X2tleV9hdF9sZWFzdF8zMl9ieXRlcw==
      JWT_EXPIRATION_MS: 900000
      JWT_ISSUER: hospital-api

      CORS_ALLOWED_ORIGINS: http://localhost:5173

      LOGIN_MAX_ATTEMPTS: 5
      LOGIN_ATTEMPT_WINDOW_MS: 900000
      LOGIN_BLOCK_DURATION_MS: 900000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and run all tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ github.run_number }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7